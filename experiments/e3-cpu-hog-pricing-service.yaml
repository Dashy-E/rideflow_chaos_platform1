# E3 — CPU hog on pricing-service (doc §13.2)
id: cpu-hog-pricing-service
description: Saturate CPU inside a pricing-service pod via a busy-loop exec to trigger HPA scale-out
fault:
  type: cpu_hog
  selector:
    namespace: rideflow
    labelSelector: app=pricing-service
  count: 1
  params:
    target_cpu_percent: 100
    hog_duration_seconds: 90
steady_state:
  - metric: sum(rate(http_requests_total{job="api-gateway",code=~"5.."}[1m]))
           / sum(rate(http_requests_total{job="api-gateway"}[1m]))
    operator: "<"
    threshold: 0.01
  - metric: histogram_quantile(0.99,
             sum(rate(http_request_duration_seconds_bucket{job="api-gateway"}[1m])) by (le))
    operator: "<"
    threshold: 1.5
blast_radius:
  max_pods_affected: 1
  max_percent_of_replicas: 34
  forbidden_namespaces: [kube-system, observability, chaos]
duration: 180s
abort_conditions:
  - metric: error_rate
    operator: ">"
    threshold: 0.25
    sustained_for: 15s
hypothesis: HPA scales out; p99 recovers < 120s
runs_required: 5
